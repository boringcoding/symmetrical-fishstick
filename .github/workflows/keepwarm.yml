name: keep-warm

# Pings the Render free-tier services so the first real visitor doesn't hit a
# 30-60s cold start. Scheduled every ~10 minutes (GitHub may delay under load).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API and web
        run: |
          curl -sS -m 40 -o /dev/null -w "api %{http_code}\n" https://lunar-api-5iwu.onrender.com/api/health || true
          curl -sS -m 40 -o /dev/null -w "web %{http_code}\n" https://lunar-web-zhl9.onrender.com/ || true
